# 本仓库是公开的数据镜像站：tvbox/、ry/ 与若干 *_list.txt / SUMMARY.txt 全部是采集脚本生成的
# 第三方播放列表与接口清单，里面的直播源 URL 容易触发密钥检测器的误判。
# 实例：tvbox/live/线路.txt 第 66 行被误报为 “Databricks Federated Account Session Token”，
# 直接导致「接口扫描处理工具」工作流的推送被 GitHub 推送保护拒绝（GH013）。
# 因此把纯数据产物排除在机密扫描与推送保护之外；代码、工作流、文档仍照常扫描。
paths-ignore:
  - "tvbox/**"
  - "ry/**"
  - "list.txt"
  - "livelist.txt"
  - "cjlist.txt"
  - "pylist.txt"
  - "apilinks.txt"
  - "rylinks.txt"
  - "SUMMARY.txt"