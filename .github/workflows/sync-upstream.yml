name: Sync upstream (lubin776/tvbox-api-backup)

on:
  schedule:
    # 每天 21:00 UTC = 北京时间次日 05:00，此时上游三个采集任务已全部跑完
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '上游无变化时也强制跑一遍镜像流程（用于首次填充或排障）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write          # 用于派发 Pages 部署工作流

# 与本站三个采集工作流共用同一把锁：同一时刻只有一个任务在写仓库，避免 push 互相顶掉
concurrency:
  group: repo-write
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/lubin776/tvbox-api-backup.git

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出镜像仓库
        uses: actions/checkout@v4

      - name: 读取上游 main 最新提交指纹
        id: upstream
        run: |
          set -euo pipefail
          sha=$(git ls-remote "$UPSTREAM_URL" refs/heads/main | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::无法获取上游 main 分支提交，请检查网络或上游仓库是否改名"
            exit 1
          fi
          prev=""
          if [ -f .github/upstream-sha ]; then
            prev=$(tr -d ' \r\n' < .github/upstream-sha)
          fi
          {
            echo "sha=$sha"
            echo "prev=$prev"
            echo "short=${sha:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "上游 main   : $sha"
          echo "上次同步指纹: ${prev:-（无，尚未同步过）}"

      - name: 判断上游是否变化
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.upstream.outputs.prev }}" ] \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游 main 未变化，本次跳过同步（不产生提交）。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到需要同步，开始整仓镜像。"
          fi

      - name: 克隆上游
        if: steps.decide.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 "$UPSTREAM_URL" /tmp/upstream

      - name: 整仓镜像到本仓库（跳过本站自有文件）
        if: steps.decide.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # --delete 让上游已删除的文件在本仓库同步消失，保证是镜像而非叠加。
          # 以下路径属于「本站自有资产」，由本站自己的工作流维护，禁止被上游覆盖或删除：
          #   .github/                 本站工作流与同步指纹
          #   README.md                本站仓库说明
          #   CNAME                    上游 CNAME 指向自定义域，带过来会导致 Pages 域名校验失败
          #   .gitattributes           本站关闭行尾转换（* -text），保证站点文件逐字节与线上一致
          #   index.html / config.json 本站前端与站点配置（取自 0.wudaozhe.net 线上版）
          #   其余站点前端页（a.html / app.html / 空壳板.html / 整合版.html / qq.html /
          #   sqtj.html / 社群推荐.html / firstpage.html / into.html / 内嵌检测页1.0.3.html）
          #   也已按本站需求改造，同样属于自有资产，禁止被上游覆盖。
          #   list.txt / livelist.txt  本站接口清单（由本站采集工作流生成）
          #   SUMMARY.txt              本站采集报告
          #   tvbox/                   本站接口数据（点播 json / 直播源 / 聚合接口）
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='/.gitattributes' \
            --exclude='/README.md' \
            --exclude='/CNAME' \
            --exclude='/index.html' \
            --exclude='/config.json' \
            --exclude='/a.html' \
            --exclude='/app.html' \
            --exclude='/空壳板.html' \
            --exclude='/整合版.html' \
            --exclude='/qq.html' \
            --exclude='/sqtj.html' \
            --exclude='/社群推荐.html' \
            --exclude='/firstpage.html' \
            --exclude='/into.html' \
            --exclude='/内嵌检测页1.0.3.html' \
            --exclude='/list.txt' \
            --exclude='/livelist.txt' \
            --exclude='/SUMMARY.txt' \
            --exclude='/tvbox/' \
            /tmp/upstream/ ./
          mkdir -p .github
          printf '%s\n' "${{ steps.upstream.outputs.sha }}" > .github/upstream-sha
          echo "上游文件总数: $(find /tmp/upstream -mindepth 1 -not -path '*/.git*' | wc -l)"

      - name: 提交并推送
        if: steps.decide.outputs.changed == 'true'
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "内容与上游已完全一致，无需提交。"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --cached --name-only | wc -l)
          echo "本次变更文件数: $changed"
          git diff --cached --name-status | head -50
          git commit -m "sync: 镜像上游 lubin776/tvbox-api-backup@${{ steps.upstream.outputs.short }}"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: 触发 Pages 重新部署
        if: success()
        run: |
          # GITHUB_TOKEN 发起的 push 不会触发其他工作流（防递归），所以这里显式派发 Pages 部署
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "## 上游同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 上游 main 提交 | \`${{ steps.upstream.outputs.sha }}\` |"
            echo "| 上次同步指纹 | \`${{ steps.upstream.outputs.prev }}\` |"
            echo "| 是否触发同步 | ${{ steps.decide.outputs.changed }} |"
            echo "| 是否产生提交 | ${{ steps.commit.outputs.committed }} |"
            echo "| 变更文件数 | ${{ steps.commit.outputs.changed }} |"
          } >> "$GITHUB_STEP_SUMMARY"